[workspace]
resolver = "2"
members = ["crates/engine", "crates/player"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/JulianAbeleda/keygen"

[workspace.dependencies]
fontdue = "=0.9.3"
minifb = "0.28"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
